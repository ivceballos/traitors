# NAS (Synology Container Manager → Proyecto). Las claves van en un archivo .env
# junto a este (ver .env.nas.example); nunca en el repositorio.
# Se publica con el túnel de Cloudflare que ya corre en el NAS:
# fyf-nas.ivceballos.com → http://192.168.1.186:4000
services:
  juego:
    build: .
    container_name: fieles-y-felones
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      KEEPALIVE_URL: https://fieles-y-felones.onrender.com/health
      PORT: 4000
    ports:
      - "4000:4000"
