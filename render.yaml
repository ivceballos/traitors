# Despliegue en Render: un único servicio que sirve la API, el tiempo real y la web.
services:
  - type: web
    name: fieles-y-felones
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Tiene que ser la misma que en el NAS, o las sesiones no valdrán en los dos
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
